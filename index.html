<h1>Jarvis</h1>
<p>Jarvis ist ein privater Assistent für eine einzelne Person. Er liest auf deren Wunsch ihre eigenen Mails, Termine und Dokumente bei Google, um ihr den Alltag zu ordnen.</p>
<p>Es gibt keine öffentlichen Nutzer, keine Anmeldung für Dritte und keinen Verkauf.</p>
